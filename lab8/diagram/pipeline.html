<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lab 8 pipeline</title>
<style>
  :root { --ink:#1b1f24; --muted:#5b6470; --stream:#7a3fc2; --batch:#1f6fb2; --alert:#c0392b; --store:#2e7d32; }
  body { margin:0; background:#fff; font-family:-apple-system, "Helvetica Neue", Arial, sans-serif; color:var(--ink); }
  svg { display:block; }
  .box rect { fill:#fff; stroke-width:2; rx:10; }
  .t { font-size:17px; font-weight:600; }
  .s { font-size:13px; fill:var(--muted); }
  .lbl { font-size:12.5px; fill:var(--muted); }
  .lane { font-size:15px; font-weight:700; letter-spacing:.04em; }
</style>
</head>
<body>
<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
  </defs>

  <text x="40" y="46" style="font-size:26px;font-weight:700">Lab 8: the payments pipeline on AWS (us-east-1)</text>
  <text x="40" y="74" class="s">Built with Terraform (lab8/infra). The speed road answers in about a minute; the batch road reads the whole month.</text>

  <!-- lanes -->
  <rect x="20" y="100" width="1560" height="470" rx="14" fill="#f6f1fc"/>
  <text x="40" y="128" class="lane" fill="#7a3fc2">PART 3 · SPEED ROAD (STREAMING)</text>
  <rect x="20" y="590" width="1560" height="290" rx="14" fill="#eef5fb"/>
  <text x="40" y="618" class="lane" fill="#1f6fb2">PART 2 · BATCH ROAD</text>

  <!-- producer -->
  <g class="box"><rect x="40" y="230" width="220" height="150" stroke="#444"/></g>
  <text x="58" y="262" class="t">Producer</text>
  <text x="58" y="286" class="s">producer.py (boto3)</text>
  <text x="58" y="306" class="s">replays 1 day of webhooks</text>
  <text x="58" y="326" class="s">in receivedAt order, 800/s</text>
  <text x="58" y="346" class="s">PutRecords × 500, retries</text>
  <text x="58" y="366" class="s">key = invoiceId</text>

  <!-- kinesis -->
  <g class="box"><rect x="330" y="230" width="230" height="150" stroke="#7a3fc2"/></g>
  <text x="348" y="262" class="t">Kinesis Data Streams</text>
  <text x="348" y="286" class="s">1 shard (1 MB/s, 1,000 rec/s)</text>
  <text x="348" y="306" class="s">24 h retention, KMS</text>
  <text x="348" y="326" class="s">ordered per invoiceId</text>
  <text x="348" y="346" class="s">two independent readers</text>

  <!-- firehose -->
  <g class="box"><rect x="640" y="150" width="270" height="170" stroke="#7a3fc2"/></g>
  <text x="658" y="182" class="t">Data Firehose</text>
  <text x="658" y="206" class="s">JSON → Parquet (Snappy),</text>
  <text x="658" y="226" class="s">schema from the Glue table</text>
  <text x="658" y="246" class="s">dynamic partitions by event day:</text>
  <text x="658" y="266" class="s">dt = modifiedDate[0:10] (JQ)</text>
  <text x="658" y="286" class="s">buffer 60 s / 64 MB</text>
  <text x="658" y="306" class="s">errors → stream-errors/</text>

  <!-- s3 stream -->
  <g class="box"><rect x="990" y="150" width="250" height="170" stroke="#2e7d32"/></g>
  <text x="1008" y="182" class="t">S3 lake</text>
  <text x="1008" y="206" class="s">stream/dt=2026-10-01/</text>
  <text x="1008" y="226" class="s">*.parquet</text>
  <text x="1008" y="256" class="s">Glue table stream_payments,</text>
  <text x="1008" y="276" class="s">partition projection</text>
  <text x="1008" y="296" class="s">(no crawler, no MSCK)</text>

  <!-- athena (shared) -->
  <g class="box"><rect x="1310" y="330" width="250" height="190" stroke="#1f6fb2"/></g>
  <text x="1328" y="362" class="t">Amazon Athena</text>
  <text x="1328" y="386" class="s">workgroup ooad-lab8,</text>
  <text x="1328" y="406" class="s">engine v3, 10 GB cut-off</text>
  <text x="1328" y="430" class="s">SQL over stream_payments,</text>
  <text x="1328" y="450" class="s">payment_events, payments,</text>
  <text x="1328" y="470" class="s">payments_parquet</text>
  <text x="1328" y="500" class="s">$5 per TB scanned</text>

  <!-- lambda -->
  <g class="box"><rect x="640" y="380" width="270" height="160" stroke="#c0392b"/></g>
  <text x="658" y="412" class="t">Lambda alerter</text>
  <text x="658" y="436" class="s">tumbling window 60 s (state kept</text>
  <text x="658" y="456" class="s">by Lambda between batches)</text>
  <text x="658" y="476" class="s">failure share per merchant,</text>
  <text x="658" y="496" class="s">duplicates counted once</text>
  <text x="658" y="516" class="s">alert if &gt; 30% and ≥ 50 payments</text>

  <!-- sns -->
  <g class="box"><rect x="990" y="400" width="250" height="120" stroke="#c0392b"/></g>
  <text x="1008" y="432" class="t">SNS topic → email</text>
  <text x="1008" y="456" class="s">ooad-lab8-alerts</text>
  <text x="1008" y="476" class="s">“Таксі: 1077 of 1641</text>
  <text x="1008" y="496" class="s">payments failed (66%)”</text>

  <!-- batch -->
  <g class="box"><rect x="40" y="660" width="260" height="180" stroke="#444"/></g>
  <text x="58" y="692" class="t">Course bucket</text>
  <text x="58" y="716" class="s">s3://ucu-ooad-lab8-payments/</text>
  <text x="58" y="736" class="s">payments/dt=…/events.jsonl</text>
  <text x="58" y="760" class="s">3,030,197 events, 1.26 GB</text>
  <text x="58" y="784" class="s">aws s3 sync (same region,</text>
  <text x="58" y="804" class="s">no transfer cost)</text>

  <g class="box"><rect x="360" y="660" width="260" height="180" stroke="#2e7d32"/></g>
  <text x="378" y="692" class="t">S3 lake: raw</text>
  <text x="378" y="716" class="s">payments/dt=…/ (JSON Lines)</text>
  <text x="378" y="746" class="s">payment_events: by hand,</text>
  <text x="378" y="766" class="s">JSON SerDe, MSCK REPAIR</text>
  <text x="378" y="790" class="s">crawled_payments: Glue</text>
  <text x="378" y="810" class="s">crawler (Way B)</text>

  <g class="box"><rect x="680" y="660" width="270" height="180" stroke="#1f6fb2"/></g>
  <text x="698" y="692" class="t">View payments</text>
  <text x="698" y="716" class="s">DISTINCT (exact duplicates),</text>
  <text x="698" y="736" class="s">then row_number() per</text>
  <text x="698" y="756" class="s">invoiceId: latest status</text>
  <text x="698" y="786" class="s">1,000,000 payments</text>

  <g class="box"><rect x="1010" y="660" width="260" height="180" stroke="#2e7d32"/></g>
  <text x="1028" y="692" class="t">S3 lake: curated</text>
  <text x="1028" y="716" class="s">curated/payments/dt=…/</text>
  <text x="1028" y="736" class="s">Parquet (CTAS), Snappy</text>
  <text x="1028" y="766" class="s">payments_parquet:</text>
  <text x="1028" y="786" class="s">0.6–8 MB scanned per query</text>
  <text x="1028" y="806" class="s">instead of 1.2 GB</text>

  <!-- arrows speed -->
  <line x1="260" y1="305" x2="326" y2="305" stroke="#444" stroke-width="2.2" marker-end="url(#a)"/>
  <text x="266" y="292" class="lbl">PutRecords</text>
  <path d="M560,280 C600,280 600,235 636,235" fill="none" stroke="#7a3fc2" stroke-width="2.2" marker-end="url(#a)"/>
  <path d="M560,330 C600,330 600,460 636,460" fill="none" stroke="#c0392b" stroke-width="2.2" marker-end="url(#a)"/>
  <text x="452" y="410" class="lbl">event source</text>
  <text x="452" y="426" class="lbl">mapping (Lambda)</text>
  <line x1="910" y1="235" x2="986" y2="235" stroke="#7a3fc2" stroke-width="2.2" marker-end="url(#a)"/>
  <text x="918" y="226" class="lbl">PutObject</text>
  <line x1="910" y1="460" x2="986" y2="460" stroke="#c0392b" stroke-width="2.2" marker-end="url(#a)"/>
  <text x="922" y="451" class="lbl">Publish</text>
  <path d="M1240,250 C1300,250 1330,290 1400,326" fill="none" stroke="#1f6fb2" stroke-width="2.2" marker-end="url(#a)"/>

  <!-- arrows batch -->
  <line x1="300" y1="750" x2="356" y2="750" stroke="#444" stroke-width="2.2" marker-end="url(#a)"/>
  <line x1="620" y1="750" x2="676" y2="750" stroke="#1f6fb2" stroke-width="2.2" marker-end="url(#a)"/>
  <line x1="950" y1="750" x2="1006" y2="750" stroke="#1f6fb2" stroke-width="2.2" marker-end="url(#a)"/>
  <text x="958" y="741" class="lbl">CTAS</text>
  <path d="M1270,720 C1330,700 1380,600 1420,524" fill="none" stroke="#1f6fb2" stroke-width="2.2" marker-end="url(#a)"/>
  <path d="M620,700 C900,620 1250,600 1360,524" fill="none" stroke="#1f6fb2" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#a)"/>
  <text x="900" y="618" class="lbl">queries on JSON (1.2 GB each)</text>
</svg>
</body>
</html>
