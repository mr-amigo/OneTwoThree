AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Meetings App - Cognito user pool (Essentials tier) with self sign-up and email verification, a
  public app client for the SPA, a managed login (version 2) domain, and Google as an identity
  provider. One sign-in page offers both email + password and Continue with Google.

Parameters:
  ProjectName:
    Type: String
    Default: meetings
    Description: Name prefix for all resources.
  CallbackUrls:
    Type: CommaDelimitedList
    Default: http://localhost:3000/auth/callback,http://localhost:5173/auth/callback
    Description: Where managed login may send users back after sign-in. Must match the app's redirect_uri exactly (the Makefile adds the site's).
  LogoutUrls:
    Type: CommaDelimitedList
    Default: http://localhost:3000/,http://localhost:5173/
    Description: Where managed login may send users after signing out.
  GoogleClientId:
    Type: String
    MinLength: 1
    Description: OAuth client ID (type Web application) from Google Cloud.
  GoogleClientSecret:
    Type: String
    MinLength: 1
    NoEcho: true
    Description: OAuth client secret from Google Cloud. Never committed; it comes from .env.

Resources:
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub ${ProjectName}-users
      # Managed login (version 2) needs the Essentials tier; the first 10,000 monthly users are free.
      UserPoolTier: ESSENTIALS
      UserPoolTags:
        PROJECT_NAME: !Ref ProjectName
      # Users sign in with their email; Cognito sends a code to verify it on sign-up.
      UsernameAttributes: [email]
      UsernameConfiguration:
        CaseSensitive: false
      AutoVerifiedAttributes: [email]
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: false
      AccountRecoverySetting:
        RecoveryMechanisms:
          - { Name: verified_email, Priority: 1 }
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireNumbers: true
          RequireUppercase: false
          RequireSymbols: false
          TemporaryPasswordValidityDays: 7
      # Cognito's own sender (about 50 emails a day), enough until SES is set up.
      EmailConfiguration:
        EmailSendingAccount: COGNITO_DEFAULT
      Schema:
        - { Name: email, AttributeDataType: String, Required: true, Mutable: true }
        - { Name: name, AttributeDataType: String, Required: false, Mutable: true }

  # Prefix domain for the OAuth endpoints and the managed login page. The prefix must be unique
  # across AWS, hence the account ID. Google's OAuth client points at this domain, so the prefix
  # is known before the stack exists: https://<ProjectName>-<account id>.auth.<region>.amazoncognito.com
  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      UserPoolId: !Ref UserPool
      Domain: !Sub ${ProjectName}-${AWS::AccountId}
      ManagedLoginVersion: 2

  # Without branding, a version 2 domain has no sign-in page to show. Cognito's own look is enough.
  ManagedLoginBranding:
    Type: AWS::Cognito::ManagedLoginBranding
    DependsOn: UserPoolDomain
    Properties:
      UserPoolId: !Ref UserPool
      ClientId: !Ref UserPoolClient
      UseCognitoProvidedValues: true

  GoogleIdentityProvider:
    Type: AWS::Cognito::UserPoolIdentityProvider
    Properties:
      UserPoolId: !Ref UserPool
      ProviderName: Google
      ProviderType: Google
      ProviderDetails:
        client_id: !Ref GoogleClientId
        client_secret: !Ref GoogleClientSecret
        authorize_scopes: openid email profile
      AttributeMapping:
        email: email
        email_verified: email_verified
        name: name

  # Public client (no secret: a browser cannot keep one; PKCE protects the code exchange instead).
  # The browser only talks to managed login and the token endpoint; the backend verifies the tokens.
  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    # A client that names a provider that does not exist yet fails to create.
    DependsOn: GoogleIdentityProvider
    Properties:
      ClientName: !Sub ${ProjectName}-web
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      # Managed login signs users in itself; the app only refreshes tokens.
      ExplicitAuthFlows:
        - ALLOW_REFRESH_TOKEN_AUTH
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      IdTokenValidity: 60
      AccessTokenValidity: 60
      RefreshTokenValidity: 30
      TokenValidityUnits:
        IdToken: minutes
        AccessToken: minutes
        RefreshToken: days
      SupportedIdentityProviders: [COGNITO, Google]
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, email, profile]
      CallbackURLs: !Ref CallbackUrls
      LogoutURLs: !Ref LogoutUrls

Outputs:
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  Region:
    Value: !Ref AWS::Region
  Issuer:
    Description: Issuer (iss) of the pool's tokens; its JWKS is at <Issuer>/.well-known/jwks.json.
    Value: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}
  HostedUiDomain:
    Description: Domain of the managed login page and the OAuth endpoints.
    Value: !Sub ${UserPoolDomain}.auth.${AWS::Region}.amazoncognito.com
